<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oyster Genomics — The seed company for ocean protein.</title>
<meta name="description" content="The seed company for ocean protein. Oyster Genomics develops parent lines for licensed hatcheries, starting with Eastern oysters on the US East Coast and Gulf.">
<meta name="theme-color" content="#eaf0e4">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef2e9;--ink:#183d32;--line:#ccd5c8;--lime:#d4f478}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--lime);color:var(--ink)}
.wrap{width:calc(100% - 112px);max-width:1440px;margin:auto}
a:focus-visible{outline:3px solid #7c922a;outline-offset:5px}
.skip{position:absolute;left:15px;top:-80px;background:var(--lime);padding:12px;z-index:100}
.skip:focus{top:10px}
header{position:relative;z-index:5}
.nav{height:100px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{display:grid;place-items:center;width:47px;height:47px;background:var(--ink);color:var(--paper);font-size:22px;letter-spacing:-2px;font-weight:600;padding-right:2px}
.brand-name{font-size:17px;line-height:1.1;letter-spacing:-.5px;font-weight:550}
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:1.08fr 1fr;min-height:690px;padding-top:59px;padding-bottom:50px;gap:35px}
.hero-copy{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;padding-top:22px}
.hero h1{font-size:clamp(48px,6.2vw,100px);font-weight:450;line-height:1.02;letter-spacing:-.065em;margin:49px 0 38px}
h1 em{font-style:normal;color:#789547}
/* The particle field shares the hero's page background. */
#hero-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none;z-index:0;mask-image:linear-gradient(90deg,transparent 20%,rgba(0,0,0,.15) 38%,#000 62%);-webkit-mask-image:linear-gradient(90deg,transparent 20%,rgba(0,0,0,.15) 38%,#000 62%)}
@media(min-width:1600px){.hero{min-height:780px}}
@media(max-width:1100px){.wrap{width:calc(100% - 64px)}.hero{min-height:610px;gap:25px}}
@media(max-width:760px){
  .wrap{width:calc(100% - 40px)}
  .nav{height:80px}
  .brand-mark{width:40px;height:40px;font-size:20px}
  .brand-name{font-size:15px}
  .hero{grid-template-columns:1fr;padding-top:33px;padding-bottom:150px;gap:36px}
  .hero-copy{padding-top:0}
  .hero h1{font-size:clamp(40px,10.6vw,74px);margin:32px 0}
  #hero-canvas{opacity:.8;mask-image:linear-gradient(180deg,transparent 24%,rgba(0,0,0,.15) 54%,#000 88%);-webkit-mask-image:linear-gradient(180deg,transparent 24%,rgba(0,0,0,.15) 54%,#000 88%)}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap">
  <div class="nav">
    <a class="brand" href="#" aria-label="Oyster Genomics home"><span class="brand-mark">OG</span><span class="brand-name">Oyster<br>Genomics</span></a>
  </div>
</header>
<main id="main">
  <div class="wrap">
    <section class="hero" aria-labelledby="hero-title">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-copy">
        <h1 id="hero-title">The seed<br>company for<br><em>ocean protein.</em></h1>
      </div>
    </section>
  </div>
</main>
<script>
// Adapted from the hero canvas at oystergenomics.com (population clustering).
// Decorative illustration only: these particles do not represent a dataset.
(() => {
  const canvas = document.getElementById('hero-canvas');
  const context = canvas && canvas.getContext('2d');
  if (!context) return;
  const hero = canvas.closest('.hero');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const compactLayout = window.matchMedia('(max-width:760px)');
  const clusters = [
    {label:'C. gigas', color:[26,107,90], cx:.42, cy:.3, rx:.08, ry:.1, n:80, angle:-.3},
    {label:'C. virginica', color:[42,139,116], cx:.58, cy:.52, rx:.06, ry:.09, n:65, angle:.4},
    {label:'O. lurida', color:[60,160,140], cx:.48, cy:.7, rx:.07, ry:.06, n:55, angle:-.1},
    {label:'S. glomerata', color:[80,130,120], cx:.35, cy:.5, rx:.05, ry:.07, n:45, angle:.6},
    {label:'hybrid', color:[30,80,70], cx:.45, cy:.5, rx:.14, ry:.14, n:15, angle:0}
  ];
  let width = 0, height = 0, particles = [], frame = null, lastTime = null;
  let inView = false;
  const pointer = {x:-1000, y:-1000};
  const running = () => !reducedMotion.matches && inView && !document.hidden && width > 0 && height > 0;
  function gaussian() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function paint() {
    context.clearRect(0, 0, width, height);
    for (const particle of particles) {
      context.beginPath();
      context.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2);
      context.fillStyle = `rgba(${particle.color.join(',')},${particle.opacity})`;
      context.fill();
    }
  }
  function tick(time) {
    frame = null;
    if (!running()) return;
    const delta = lastTime === null ? 1 : Math.min((time - lastTime) / (1000 / 60), 2);
    lastTime = time;
    const radius = Math.min(120, width * .2);
    for (const particle of particles) {
      particle.vx += ((particle.homeX - particle.x) * .003 + (Math.random() - .5) * .08) * delta;
      particle.vy += ((particle.homeY - particle.y) * .003 + (Math.random() - .5) * .08) * delta;
      const dx = particle.x - pointer.x, dy = particle.y - pointer.y;
      const distance = Math.hypot(dx, dy);
      if (distance < radius && distance > .001) {
        const force = (radius - distance) / radius * .5 * delta;
        particle.vx += dx / distance * force;
        particle.vy += dy / distance * force;
      }
      const damping = Math.pow(.94, delta);
      particle.vx *= damping;
      particle.vy *= damping;
      particle.x += particle.vx * delta;
      particle.y += particle.vy * delta;
    }
    paint();
    frame = requestAnimationFrame(tick);
  }
  function sync() {
    if (running() && frame === null) {
      lastTime = null;
      frame = requestAnimationFrame(tick);
    } else if (!running() && frame !== null) {
      cancelAnimationFrame(frame);
      frame = null;
      lastTime = null;
    }
  }
  function resize() {
    const rect = hero.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    particles = [];
    const compact = compactLayout.matches;
    const sceneWidth = width * (compact ? .95 : .62);
    const sceneHeight = height * (compact ? .42 : .92);
    const left = width - sceneWidth - (compact ? 0 : width * .01);
    const top = compact ? height - sceneHeight : height * .04;
    for (const cluster of clusters) {
      for (let i = 0; i < cluster.n; i++) {
        const x = gaussian() * cluster.rx * sceneWidth * 1.25;
        const y = gaussian() * cluster.ry * sceneHeight * .825;
        const cos = Math.cos(cluster.angle), sin = Math.sin(cluster.angle);
        const homeX = left + (.5 + (cluster.cx - .47) * 2.5) * sceneWidth + x * cos - y * sin;
        const homeY = top + (.5 + (cluster.cy - .5) * 1.65) * sceneHeight + x * sin + y * cos;
        particles.push({x:homeX, y:homeY, homeX, homeY, vx:0, vy:0, r:Math.random() * 1.8 + 1.2,
          color:cluster.color, opacity:cluster.label === 'hybrid' ? .12 : .2 + Math.random() * .3});
      }
    }
    paint();
    sync();
  }
  hero.addEventListener('pointermove', event => {
    if (event.pointerType === 'touch') return;
    const rect = canvas.getBoundingClientRect();
    pointer.x = event.clientX - rect.left;
    pointer.y = event.clientY - rect.top;
  }, {passive:true});
  hero.addEventListener('pointerleave', () => {pointer.x = pointer.y = -1000;});
  reducedMotion.addEventListener('change', sync);
  compactLayout.addEventListener('change', resize);
  document.addEventListener('visibilitychange', sync);
  window.addEventListener('pagehide', () => {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    lastTime = null;
  });
  window.addEventListener('pageshow', sync);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(entries => {inView = entries[0].isIntersecting; sync();}).observe(hero);
  } else inView = true;
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(hero);
  else window.addEventListener('resize', resize, {passive:true});
  resize();
})();
</script>
</body>
</html>
